<!doctype html>
<html lang="en" data-version="__BUILD_VERSION__">
  <head>
    <meta charset="utf-8">

      main { text-align: center; padding: 2rem; }
      .auth-callback-back { display: inline-block; margin-top: 1rem; color: #93c5fd; }
    </style>

  <body>
    <main>
      <p id="auth-status">Finishing sign-in…</p>
