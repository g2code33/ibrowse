<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">Yayra</title>
  <desc id="desc">Yayra browser logo: a luminous, floating Y-shaped orbit mark beside the Yayra wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="22" y1="18" x2="226" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172B55"/>
      <stop offset="1" stop-color="#071326"/>
    </linearGradient>
    <linearGradient id="mark" x1="51" y1="55" x2="203" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65F0FF"/>
      <stop offset=".52" stop-color="#24B9F4"/>
      <stop offset="1" stop-color="#7777FF"/>
    </linearGradient>
    <linearGradient id="word" x1="302" y1="90" x2="660" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="1" stop-color="#C8D9F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(18 12)">
    <rect x="0" y="0" width="236" height="236" rx="66" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="233" height="233" rx="64.5" fill="none" stroke="#7ADDF8" stroke-opacity=".28" stroke-width="3"/>
    <circle cx="118" cy="118" r="79" fill="none" stroke="#5BDDF7" stroke-opacity=".18" stroke-width="2"/>
    <path d="M61 76 C78 58 101 50 124 54 C151 58 173 76 182 101" fill="none" stroke="url(#mark)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M66 82 L116 139 L166 82" fill="none" stroke="url(#mark)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116 139 L116 184" fill="none" stroke="#F4FCFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M48 139 C53 166 74 187 101 194" fill="none" stroke="#42D9F5" stroke-opacity=".72" stroke-width="4" stroke-linecap="round"/>
    <circle cx="183" cy="63" r="10" fill="#83F4FF" filter="url(#glow)"/>
    <circle cx="183" cy="63" r="4" fill="#FFFFFF"/>
  </g>
  <text x="292" y="153" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="112" font-weight="750" letter-spacing="-5">Yayra</text>
  <path d="M300 184 H605" stroke="#39CFF2" stroke-width="5" stroke-linecap="round" opacity=".82"/>
  <text x="302" y="220" fill="#8FA9CC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="500" letter-spacing="5">FLOAT. BROWSE. FLOW.</text>
</svg>