name: Release build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Semver override to apply to all manifests for this run (blank uses package.json)'
        required: false
        type: string
      publish:
        description: 'Publish draft-first release and update manifest'
        required: true
        type: boolean
        default: false
      targets:
        description: 'Comma-separated targets: web,desktop-win,desktop-linux,android,ios or all'
        required: true
        type: string
        default: desktop-linux,android

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  web:
    name: web PWA bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate version in release feed
        if: github.ref == 'refs/heads/main' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-version-not-released.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run verify:pwa
      - run: npm run verify:packaging
      - run: npm run verify:branding
      - id: artifact
        run: node scripts/prepare-artifact.mjs --target pwa --input dist --signed true --why-not "PWA static bundle is integrity-covered by SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  desktop-linux:
    name: linux deb and AppImage
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name != 'workflow_dispatch' || contains(inputs.targets, 'all') || contains(inputs.targets, 'desktop-linux') || contains(inputs.targets, 'linux')
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        shell: bash
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          if [ -z "$LINUX_SIGNING_KEY" ]; then
            echo "::warning:: Linux signing skipped: LINUX_SIGNING_KEY is not configured; building unsigned .deb and .AppImage"
            {
              echo "## Signing skipped"
              echo "Linux: LINUX_SIGNING_KEY is absent, so the .deb and .AppImage are unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run package:linux
      - run: npm run verify:packaging
      - name: Sign Linux packages and AppImage
        if: steps.signing.outputs.signed == 'true'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_KEY_PASSWORD: ${{ secrets.LINUX_SIGNING_KEY_PASSWORD }}
        run: node scripts/sign-linux-artifacts.mjs release
      - id: artifact
        shell: bash
        run: |
          input="release/*.deb,release/*.AppImage"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            input="$input,release/*.deb.sig,release/*.AppImage.sig,release/linux-signing-public-key.pem"
          fi
          node scripts/prepare-artifact.mjs --target linux --input "$input" --signed "${{ steps.signing.outputs.signed }}" --why-not "LINUX_SIGNING_KEY not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  desktop-win:
    name: windows NSIS and portable
    runs-on: windows-latest
    needs: web
    if: github.event_name != 'workflow_dispatch' || contains(inputs.targets, 'all') || contains(inputs.targets, 'desktop-win') || contains(inputs.targets, 'windows')
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - shell: bash
        run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ] || [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "::warning:: Windows signing skipped: WINDOWS_CERTIFICATE_BASE64 or WINDOWS_CERTIFICATE_PASSWORD is not configured"
            {
              echo "## Signing skipped"
              echo "Windows: certificate secrets are absent, so NSIS and portable .exe artifacts are unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$WINDOWS_CERTIFICATE_BASE64" | base64 -d > windows-cert.pfx
            echo "CSC_LINK=$PWD/windows-cert.pfx" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run package:win
      - name: Verify Windows executables
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error 'no exe produced under release/'
            exit 1
          }
          node scripts/assert-windows-version.mjs $exe.FullName
      - id: artifact
        shell: bash
        run: node scripts/prepare-artifact.mjs --target windows --signed ${{ steps.signing.outputs.signed }} --why-not "WINDOWS_CERTIFICATE_BASE64 or WINDOWS_CERTIFICATE_PASSWORD not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  android:
    name: android release APK
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name != 'workflow_dispatch' || contains(inputs.targets, 'all') || contains(inputs.targets, 'android')
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning:: Android signing skipped: one or more Android keystore secrets are absent; release APK is unsigned"
            {
              echo "## Signing skipped"
              echo "Android: keystore secrets are absent, so the APK is unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-release.keystore
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android-release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build:android
      - id: artifact
        run: node scripts/prepare-artifact.mjs --target android --signed ${{ steps.signing.outputs.signed }} --why-not "Android keystore secrets not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  ios:
    name: iOS archive/export
    runs-on: macos-14
    needs: web
    if: github.event_name != 'workflow_dispatch' || contains(inputs.targets, 'all') || contains(inputs.targets, 'ios')
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: if [ -n "${{ inputs.version_override }}" ]; then node scripts/version.mjs "${{ inputs.version_override }}"; fi
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "::warning:: iOS signing skipped: Apple Developer/App Store Connect secrets are incomplete; archive is unsigned"
            {
              echo "## Signing skipped"
              echo "iOS: Apple Developer/App Store Connect secrets are absent or incomplete, so the archive/export is unsigned. Artifact name includes unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/ensure-capacitor-platform.mjs ios
      - run: npx cap sync ios
      - name: Install Apple signing credentials
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/yayra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/yayra-signing.p12"
          PRIVATE_KEY_DIR="$RUNNER_TEMP/private_keys"
          PRIVATE_KEY_PATH="$PRIVATE_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          python3 - "$P12_PATH" <<'PY'
          import base64, os, pathlib, sys
          value = os.environ["APPLE_CERTIFICATE_P12_BASE64"]
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(value))
          PY
          security import "$P12_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$PRIVATE_KEY_DIR"
          python3 - "$PRIVATE_KEY_PATH" <<'PY'
          import base64, os, pathlib, sys
          value = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].replace('\\n', '\n')
          if "BEGIN PRIVATE KEY" not in value:
              value = base64.b64decode(value).decode()
          pathlib.Path(sys.argv[1]).write_text(value)
          PY
          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_AUTH_KEY_PATH=$PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          cat > ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
      - name: Build signed or unsigned archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates -authenticationKeyPath "$APPLE_AUTH_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" -archivePath build/yayra.xcarchive archive
            xcodebuild -exportArchive -archivePath build/yayra.xcarchive -exportPath build/ios-export -exportOptionsPlist ios/exportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$APPLE_AUTH_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          else
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO archive -archivePath build/yayra.xcarchive
          fi
      - id: artifact
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            input="build/ios-export/*.ipa"
          else
            input="build/yayra.xcarchive"
          fi
          node scripts/prepare-artifact.mjs --target ios --input "$input" --signed "${{ steps.signing.outputs.signed }}" --why-not "Apple Developer/App Store Connect secrets not configured"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  publish:
    name: draft release, verify assets, publish live
    runs-on: ubuntu-latest
    needs: [web, desktop-linux, desktop-win, android, ios]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts
          merge-multiple: false
      - run: node scripts/ci-summary.mjs .artifacts
      - name: Refuse to publish unsigned artifacts
        run: node scripts/assert-release-signed.mjs .artifacts
      - run: node scripts/generate-update-manifest.mjs dist/updates/manifest.json .artifacts
      - name: Deploy web to Cloudflare Pages when configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::warning:: Web deploy skipped: Cloudflare Pages secrets are not configured"
            {
              echo "## Signing skipped"
              echo "Web deploy: Cloudflare Pages credentials are absent. Release assets are still prepared."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME"
          fi
      - name: Publish draft-first GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs "v${{ needs.web.outputs.version }}" .artifacts
      - name: Verify live release and manifest contract
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MANIFEST_URL: https://updates.yayra.app/updates/manifest.json
        run: node scripts/release-verify.mjs "v${{ needs.web.outputs.version }}"
