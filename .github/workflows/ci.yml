name: Build-only CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web bundle and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run verify:pwa
      - run: npm run verify:packaging
      - run: npm run verify:branding
      - uses: actions/upload-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  desktop-linux:
    name: linux deb and AppImage build-only
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report unsigned Linux build
        run: |
          echo "::warning:: Linux signing skipped: no Linux signing secret is configured for PR build-only artifacts"
          {
            echo "## Signing skipped"
            echo "Linux PR build-only artifacts are unsigned; release.yml records this in artifact names."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run package:linux
      - run: npm run verify:packaging

  desktop-win:
    name: windows NSIS and portable build-only
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report Windows signing status
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ]; then
            echo "::warning:: Windows signing skipped: WINDOWS_CERTIFICATE_BASE64 is not configured for PR build-only artifacts"
            {
              echo "## Signing skipped"
              echo "Windows PR build-only artifacts are unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run package:win
      - name: Verify Windows executables
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error 'no exe produced under release/'
            exit 1
          }
          node scripts/assert-windows-version.mjs $exe.FullName

  android:
    name: android APK build-only
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report Android signing status
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning:: Android signing skipped: ANDROID_KEYSTORE_BASE64 is not configured; assembleRelease uploads an unsigned APK"
            {
              echo "## Signing skipped"
              echo "Android PR build-only APK is unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build:android

  ios:
    name: iOS archive build-only
    runs-on: macos-14
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: yayra-web-dist-${{ github.sha }}
          path: dist
      - name: Report Apple signing status
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "::warning:: iOS signing skipped: APPLE_TEAM_ID or APP_STORE_CONNECT_KEY_ID is not configured; CI performs an unsigned archive attempt"
            {
              echo "## Signing skipped"
              echo "iOS PR build-only archive is unsigned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: node scripts/ensure-capacitor-platform.mjs ios
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO archive -archivePath build/yayra.xcarchive
