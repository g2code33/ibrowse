<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yayra Web Companion</title>
  <style>body{min-width:250px;margin:0;padding:16px;background:#081226;color:#f8fafc;font:14px system-ui,sans-serif}h1{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;gap:8px;margin:10px 0}small{display:block;color:#94a3b8;margin-top:12px;line-height:1.4}</style>
</head>
<body>
  <h1>Yayra Web Companion</h1>
  <label class="row"><input type="checkbox" id="shield"> Block ads and trackers</label>
  <label class="row"><input type="checkbox" id="darkReader"> Dark reader</label>
  <label class="row"><input type="checkbox" id="readerMode"> Clean reader mode</label>
  <small>These controls run as a real browser extension on the current website.</small>
  <script src="popup.js"></script>
</body>
</html>
